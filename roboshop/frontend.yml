- name: Install and start Nginx on CentOS
  hosts: webservers
  become: yes
  tasks:
    - name: Ensure Nginx is at the latest version
      ansible.builtin.yum:
        name: nginx
        state: latest
    - name: Ensure Nginx service is running and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes